<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hermes">
<title>Hermes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <section class="screen" id="key-screen" hidden>
    <div class="key-wrap">
      <div class="wordmark">Hermes</div>
      <h1>Phone</h1>
      <p>Same sessions as the CLI and the desktop app. The API key stays in this browser.</p>
      <form id="key-form">
        <label for="key-input">API key</label>
        <input id="key-input" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <div class="key-actions">
          <button class="textbtn primary" type="submit">Continue</button>
          <button class="textbtn" type="button" id="forget">Forget</button>
        </div>
        <div class="err" id="key-err" hidden></div>
      </form>
    </div>
  </section>

  <section class="screen" id="lock-screen" hidden>
    <div class="key-wrap">
      <div class="wordmark">Hermes</div>
      <h1>Locked</h1>
      <p>Unlock with Face ID to see your sessions.</p>
      <div class="key-actions">
        <button class="textbtn primary" type="button" id="unlock">Unlock with Face ID</button>
      </div>
      <div class="err" id="lock-err" hidden></div>
    </div>
  </section>

  <section class="screen" id="setup-screen" hidden>
    <div class="key-wrap">
      <div class="wordmark">Hermes</div>
      <h1>Set up Face ID</h1>
      <p id="setup-text">Enter the setup code shown on the Mac.</p>
      <form id="setup-form">
        <label for="setup-code">Setup code</label>
        <input id="setup-code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="12">
        <div class="key-actions">
          <button class="textbtn primary" type="submit" id="setup-btn">Check code</button>
          <button class="textbtn" type="button" id="setup-skip">Not now</button>
        </div>
        <div class="err" id="setup-err" hidden></div>
      </form>
    </div>
  </section>

  <section class="screen" id="list-screen" hidden>
    <header class="bar">
      <div class="wordmark grow">Hermes</div>
      <button class="textbtn" type="button" id="key-btn">Key</button>
    </header>
    <button class="new-session" type="button" id="new-chat">
      <span class="new-mark" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </span>
      New session
    </button>
    <div class="list" id="session-list"></div>
  </section>

  <section class="screen" id="chat-screen" hidden>
    <header class="bar">
      <button class="icon" type="button" id="back" aria-label="Sessions">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 3.5 6 9l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="title grow" id="chat-title">Hermes</div>
      <button class="icon" type="button" id="menu-btn" aria-label="Session actions" aria-expanded="false" aria-controls="menu">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="3.5" cy="9" r="1.6" fill="currentColor"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><circle cx="14.5" cy="9" r="1.6" fill="currentColor"/></svg>
      </button>
    </header>
    <div class="menu" id="menu" hidden>
      <div class="menu-col" id="menu-main">
        <div class="menu-row">
          <button class="textbtn" type="button" id="menu-rename">Rename</button>
          <button class="textbtn" type="button" id="menu-fork">Fork</button>
          <button class="textbtn deny" type="button" id="menu-delete">Delete</button>
        </div>
        <div class="menu-hint" id="menu-hint"></div>
      </div>
      <form class="menu-row" id="rename-form" hidden>
        <input id="rename-input" type="text" maxlength="100" autocomplete="off" enterkeyhint="done" aria-label="Session name" placeholder="Session name">
        <button class="textbtn primary" type="submit">Save</button>
        <button class="textbtn" type="button" id="rename-cancel">Cancel</button>
      </form>
      <div class="menu-col" id="delete-confirm" hidden>
        <div class="desc">Delete this session and all its messages? This cannot be undone.</div>
        <div class="menu-row">
          <button class="textbtn deny" type="button" id="delete-yes">Delete</button>
          <button class="textbtn" type="button" id="delete-no">Cancel</button>
        </div>
      </div>
      <div class="err" id="menu-err" hidden></div>
    </div>
    <div class="transcript" id="transcript"></div>
    <div class="composer">
      <div class="banner" id="other-run" hidden></div>
      <div class="notice" id="notice" hidden></div>
      <div id="approvals"></div>
      <form id="composer" class="composer-surface">
        <textarea id="draft" rows="1" placeholder="Give Hermes a task" enterkeyhint="enter"></textarea>
        <div class="actions">
          <button class="stop" id="stop" type="button" hidden aria-label="Stop">Stop</button>
          <button class="send" id="send" type="submit" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
<script src="vendor/purify.min.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
